[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vichouse"
version = "1.0.0"
description = "Do crime and gambling rates predict house prices across Victorian LGAs?"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
